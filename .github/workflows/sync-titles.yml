name: Sync Member Titles from Dex CRM

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  sync-titles:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Sync titles from Dex CRM
        env:
          DEX_API_KEY: ${{ secrets.DEX_API_KEY }}
        run: python .github/scripts/sync_titles.py

      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/members.ts
          if git diff --staged --quiet; then
            echo "No title changes -- nothing to commit."
          else
            git commit -m "Auto-sync: update member job titles from Dex CRM [skip ci]"
            git push
          fi
